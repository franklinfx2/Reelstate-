name: Process video

on:
  workflow_dispatch:
    inputs:
      uploadId:
        description: "uploads.id to process"
        required: true
        type: string
      videoUrl:
        description: "Public URL of the raw uploaded video"
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install service dependencies
        working-directory: video-service
        run: npm install --omit=dev

      - name: Render and upload
        working-directory: video-service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node run-job.mjs "${{ inputs.uploadId }}" "${{ inputs.videoUrl }}"
