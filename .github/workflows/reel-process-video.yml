name: Assemble reel video

on:
  workflow_dispatch:
    inputs:
      projectId:
        description: "reel_projects.id to assemble (photos-only Kling flow) — every clip must already be ready"
        required: true
        type: string

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install service dependencies
        working-directory: video-service
        run: npm install --omit=dev

      - name: Download clips and assemble video
        working-directory: video-service
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node reel-run-job.mjs "${{ inputs.projectId }}"
